<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Modificar Libro</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../formularios.css">
</head>
<body>

    <header class="top-bar">
        <h1>BIBLIOTECA UNIVERSITARIA</h1>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav>
                <a href="index.html">Inicio</a>
                <a href="prestamos.html">Préstamos</a>
                <a href="devoluciones.html">Devoluciones</a>
                <a href="reportes.html">Reportes</a>
                <a href="alta.html">Alta de Libros</a>
                <a href="modificar.html" class="active">Modificar Libro</a>
                <a href="eliminar.html">Eliminar Libro</a>
            </nav>
        </aside>

        <main class="content">
            <h2>Modificar Libro</h2>

            <div class="search-form">
                <label>Buscar por ISBN:</label>
                <input type="text" placeholder="Ingrese ISBN...">
                <button class="btn btn-blue">BUSCAR</button>
            </div>

            <form class="book-form" action="#" method="post" style="margin-top:20px;">
                <label>Título</label>
                <input type="text" name="titulo" placeholder="Título del libro" required>

                <label>Autor</label>
                <input type="text" name="autor" placeholder="Nombre del autor" required>

                <label>ISBN</label>
                <input type="text" name="isbn" placeholder="ISBN" required>

                <label>Editorial</label>
                <input type="text" name="editorial" placeholder="Editorial">

                <label>Año</label>
                <input type="number" name="anio" placeholder="Año de publicación">

                <label>Género</label>
                <input type="text" name="genero" placeholder="Género o categoría">

                <label>Copias</label>
                <input type="number" name="copias" min="1" value="1">

                <label>Descripción</label>
                <textarea name="descripcion" rows="4" placeholder="Breve descripción"></textarea>

                <div class="form-actions">
                    <button class="btn btn-blue" type="submit">ACTUALIZAR</button>
                    <a href="index.html" class="btn btn-gray">CANCELAR</a>
                </div>
            </form>

        </main>

        <img src="../SEBASWEST.png" alt="Sebas West Logo" class="sebas-west-corner">
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                <p>SEBAS ₩€$₺ CORPORATION</p>
                <p>© 2026 - Todos los derechos reservados</p>
                <nav class="footer-links">
                <a href="nosotros.html">Sobre Nosotros</a>
                <span class="separator">|</span>
                <a href="nosotros.html#mision">Misión y Visión</a>
                <span class="separator">|</span>
                <a href="nosotros.html#valores">Nuestros Valores</a>
            </nav>
            </div>
        </div>
        
    </footer>

</body>
</html>
