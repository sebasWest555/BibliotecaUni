<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Devoluciones</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="top-bar">
        <h1>BIBLIOTECA UNIVERSITARIA</h1>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav>
                <a href="index.html">Inicio</a>
                <a href="prestamos.html">Préstamos</a>
                <a href="devoluciones.html" class="active">Devoluciones</a>
                <a href="reportes.html">Reportes</a>
                <a href="alta.html">Alta de Libros</a>
                <a href="modificar.html">Modificar Libro</a>
                <a href="eliminar.html">Eliminar Libro</a>
                <a href="cubiculos.html">Cubículos</a>
            </nav>
        </aside>

        <main class="content">
            <h2>Registro de Devolución</h2>

            <form class="book-form" id="formDevolucion" action="#" method="post" novalidate>

                <label for="isbnDevolucion">ISBN del Libro</label>
                <input type="text" id="isbnDevolucion" name="isbnDevolucion" placeholder="10 o 13 dígitos">
                <span class="campo-error" id="error-isbnDevolucion" style="display:none;"></span>

                <label for="matriculaDevolucion">Matrícula del Alumno</label>
                <input type="text" id="matriculaDevolucion" name="matriculaDevolucion" placeholder="Ej. A012345">
                <span class="campo-error" id="error-matriculaDevolucion" style="display:none;"></span>

                <div class="form-actions">
                    <button class="btn btn-green" type="submit">CONFIRMAR DEVOLUCIÓN</button>
                    <a href="index.html" class="btn btn-gray">CANCELAR</a>
                </div>

            </form>

            <div class="mensaje-exito" id="mensajeDevolucion" style="display:none;"></div>

        </main>

        <img src="../SEBASWEST.png" alt="Logo Sebas West Corporation" class="sebas-west-corner">
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                <p>SEBAS ₩€$₺ CORPORATION</p>
                <p>© 2026 - Todos los derechos reservados</p>
                <nav class="footer-links">
                    <a href="nosotros.html">Sobre Nosotros</a>
                    <span class="separator">|</span>
                    <a href="nosotros.html#mision">Misión y Visión</a>
                    <span class="separator">|</span>
                    <a href="nosotros.html#valores">Nuestros Valores</a>
                </nav>
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/validaciones.js"></script>

</body>
</html>
