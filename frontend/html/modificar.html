<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Modificar Libro</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../formularios.css">
</head>

<body>

    <header class="top-bar">
        <h1>BIBLIOTECA UNIVERSITARIA</h1>
        <div id="headerAdmin">
            <button class="btn-admin-login" id="btnAbrirLogin">&#128274; Administrador</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav>
                <a href="index.html">Inicio</a>
                <a href="prestamos.html" class="solo-admin" style="display:none;">Préstamos</a>
                <a href="devoluciones.html" class="solo-admin" style="display:none;">Devoluciones</a>
                <a href="reportes.html" class="solo-admin" style="display:none;">Reportes</a>
                <a href="alta.html" class="solo-admin" style="display:none;">Alta de Libros</a>
                <a href="modificar.html" class="solo-admin" style="display:none;">Modificar Libro</a>
                <a href="eliminar.html" class="solo-admin" style="display:none;">Eliminar Libro</a>
                <a href="cubiculos.html">Cubículos</a>
            </nav>
        </aside>

        <main class="content">
            <h2>Modificar Libro</h2>

            <div class="search-form">
                <label for="isbnBuscar">Buscar por ISBN:</label>
                <input type="text" id="isbnBuscar" placeholder="Ingrese ISBN...">
                <button class="btn btn-blue" id="btnBuscarISBN">BUSCAR</button>
            </div>

            <div class="mensaje-formulario" id="mensajeFormulario" style="display:none;"></div>

            <form class="book-form" id="formLibro" action="#" method="post" novalidate style="margin-top:20px;">

                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" placeholder="Título del libro">
                <span class="campo-error" id="error-titulo" style="display:none;"></span>

                <label for="autor">Autor</label>
                <input type="text" id="autor" name="autor" placeholder="Nombre del autor">
                <span class="campo-error" id="error-autor" style="display:none;"></span>

                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="10 o 13 dígitos numéricos">
                <span class="campo-error" id="error-isbn" style="display:none;"></span>

                <label for="editorial">Editorial</label>
                <input type="text" id="editorial" name="editorial" placeholder="Editorial">
                <span class="campo-error" id="error-editorial" style="display:none;"></span>

                <label for="anio">Año</label>
                <input type="number" id="anio" name="anio" placeholder="Año de publicación">
                <span class="campo-error" id="error-anio" style="display:none;"></span>

                <label for="genero">Género</label>
                <input type="text" id="genero" name="genero" placeholder="Género o categoría">
                <span class="campo-error" id="error-genero" style="display:none;"></span>

                <label for="copias">Copias</label>
                <input type="number" id="copias" name="copias" min="1" value="1">
                <span class="campo-error" id="error-copias" style="display:none;"></span>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="4" placeholder="Breve descripción"></textarea>
                <span class="campo-error" id="error-descripcion" style="display:none;"></span>

                <div class="form-actions">
                    <button class="btn btn-blue" type="submit">ACTUALIZAR</button>
                    <a href="index.html" class="btn btn-gray">CANCELAR</a>
                </div>

            </form>
        </main>

        <img src="../SEBASWEST.png" alt="Logo Sebas West Corporation" class="sebas-west-corner">
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                <p>SEBAS ₩€$₺ CORPORATION</p>
                <p>© 2026 - Todos los derechos reservados</p>
                <nav class="footer-links">
                    <a href="nosotros.html">Sobre Nosotros</a>
                    <span class="separator">|</span>
                    <a href="nosotros.html#mision">Misión y Visión</a>
                    <span class="separator">|</span>
                    <a href="nosotros.html#valores">Nuestros Valores</a>
                </nav>
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/biblioteca.js"></script>
    <script src="../js/validaciones.js"></script>
    <script>
        /* Buscar libro por ISBN y prellenar formulario */
        $(function () {
            $("#btnBuscarISBN").on("click", function () {
                const isbn = $("#isbnBuscar").val().trim();
                const libro = catalogoLibros.find(l => l.isbn === isbn);
                if (libro) {
                    $("#titulo").val(libro.titulo);
                    $("#autor").val(libro.autor);
                    $("#isbn").val(libro.isbn);
                    $("#editorial").val(libro.editorial);
                    $("#anio").val(libro.anio);
                    $("#genero").val(libro.genero);
                    $("#copias").val(libro.copias);
                    $("#descripcion").val(libro.descripcion);
                    $("#formLibro").slideDown(300);
                } else {
                    alert("No se encontró un libro con ese ISBN.");
                }
            });
        });
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
